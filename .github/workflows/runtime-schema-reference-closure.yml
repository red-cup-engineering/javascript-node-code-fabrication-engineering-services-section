name: Native runtime schema-reference closure

on:
  pull_request:
    paths:
      - 'scripts/transform-json-schema-to-typescript.mjs'
      - 'test/runtime-reference-closure.test.mjs'
      - '.github/workflows/runtime-schema-reference-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualified-reference-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check actual source and native dependency-free regressions
        run: |
          node --check scripts/transform-json-schema-to-typescript.mjs
          node --check test/runtime-reference-closure.test.mjs
          node --test test/runtime-reference-closure.test.mjs
