name: Native runtime schema-reference closure

on:
  pull_request:
    paths:
      - 'scripts/transform-json-schema-to-typescript.mjs'
      - 'test/runtime-reference-closure.test.mjs'
      - 'test/source-reviewed-architecture-fabrication.test.mjs'
      - 'test/source-reviewed-design-fabrication.test.mjs'
      - 'test/index.test.mjs'
      - 'test/jsnode-assay-packed-receiver.mjs'
      - 'services/jsnode-package-services-section'
      - 'package.json'
      - '.github/workflows/runtime-schema-reference-closure.yml'
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualified-reference-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Select the source-and-build-qualified original Specification/Design reader and schema
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/specification-engineering-services-section
          ref: b6377fe310bc17131bacb89c3500eb6597ba961f
          path: specification-source
          persist-credentials: false
      - name: Select exact original JSNode maker source for independent Code receiving
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/jsnode-package-engineering-services-section
          ref: f039a4fd4f3fc844fc7aa7455dd16f38ebf1cd77
          path: jsnode-package-source
          persist-credentials: false
      - name: Verify original schema origin and install the actual Code runtime consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C specification-source rev-parse HEAD)" = "b6377fe310bc17131bacb89c3500eb6597ba961f"
          test "$(git hash-object specification-source/data/records/schema/architecture-description.schema.json)" = "978863fa30df43b9c207fdac0fef085f9a37407e"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/
          npm install --prefix specification-source --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/
          node -e "const p=require('./node_modules/@red-cup-engineering/signcell/package.json');if(p.version!=='0.4.2')process.exit(1)"
      - name: Independently authenticate the exact original Specification maker package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/specification-attestation"
          # Reproduce the original signed job's package at the already pinned
          # upstream revision, not an unaudited mutable npm registry version.
          (
            cd specification-source
            npm pack --ignore-scripts --silent               --pack-destination "$RUNNER_TEMP/specification-attestation" >/dev/null
          )
          shopt -s nullglob
          archives=( "$RUNNER_TEMP"/specification-attestation/*.tgz )
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          # Digest of upstream merged-main run 40576268741's real signed subject.
          printf '%s  %s\n'             ca02fc9d2c358172ae05e3db924d59407055ed48eb5d09d7d11d193e6251542a             "$archive" | sha256sum --check --strict
          # A Git checkout pin and checksum do not verify builder identity:
          # demand the original public Sigstore/SLSA statement for these bytes,
          # workflow and immutable source revision.
          gh attestation verify "$archive"             --repo red-cup-engineering/specification-engineering-services-section             --signer-workflow red-cup-engineering/specification-engineering-services-section/.github/workflows/specification-native-receiving.yml             --source-digest b6377fe310bc17131bacb89c3500eb6597ba961f             --deny-self-hosted-runners             --format json > "$RUNNER_TEMP/specification-attestation/verified.json"
          node --input-type=module - "$archive" "$RUNNER_TEMP/specification-attestation/verified.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const [, , tarball, verificationFile] = process.argv;
          const digest = createHash('sha256').update(readFileSync(tarball)).digest('hex');
          const records = JSON.parse(readFileSync(verificationFile, 'utf8'));
          assert.ok(Array.isArray(records) && records.length > 0, 'no independently verified statement');
          assert.ok(records.some(row => {
            const statement = row?.verificationResult?.statement;
            return statement?.predicateType === 'https://slsa.dev/provenance/v1' &&
              statement.subject?.some(subject => subject.digest?.sha256 === digest);
          }), 'no signed SLSA v1 statement names the exact original artifact bytes');
          console.log('Source-qualified upstream maker: exact checksum and independently verified Sigstore/SLSA v1 statement received.');
          NODE
          cp "$archive" "$RUNNER_TEMP/specification-attestation/tampered.tgz"
          printf x >> "$RUNNER_TEMP/specification-attestation/tampered.tgz"
          if gh attestation verify "$RUNNER_TEMP/specification-attestation/tampered.tgz"             --repo red-cup-engineering/specification-engineering-services-section             --signer-workflow red-cup-engineering/specification-engineering-services-section/.github/workflows/specification-native-receiving.yml             --source-digest b6377fe310bc17131bacb89c3500eb6597ba961f             --deny-self-hosted-runners > "$RUNNER_TEMP/specification-attestation/invalid-response.txt" 2>&1; then
            echo "::error::One-byte-modified Specification package was accepted as signed"
            exit 1
          fi
          echo "Original signed source admitted; one-byte-modified source refused. Semantic Stage Proof and fabrication authorization remain unreceived."
      - name: Generate and test Code against original Requirement-traced Architecture schema
        env:
          SPEC_ARCHITECTURE_SCHEMA_FILE: ${{ github.workspace }}/specification-source/data/records/schema/architecture-description.schema.json
          SPEC_ARCHITECTURE_SOURCE_DIR: ${{ github.workspace }}/specification-source
        run: |
          node --check scripts/transform-json-schema-to-typescript.mjs
          node --check test/index.test.mjs
          node --check test/runtime-reference-closure.test.mjs
          node --check test/source-reviewed-architecture-fabrication.test.mjs
          node --check test/source-reviewed-design-fabrication.test.mjs
          node --test test/index.test.mjs test/runtime-reference-closure.test.mjs test/source-reviewed-architecture-fabrication.test.mjs test/source-reviewed-design-fabrication.test.mjs
      - name: Independently install packed original Code maker and receive HLD/LLD through its public export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/code-consumer"
          archive="$(npm pack --ignore-scripts --silent)"
          test -s "$archive"
          sha256sum "$archive"
          npm install --prefix "$RUNNER_TEMP/code-consumer" "$GITHUB_WORKSPACE/$archive" \
            --ignore-scripts --no-audit --no-fund --no-package-lock \
            --registry=https://registry.561.group/
          cp test/source-reviewed-design-fabrication.test.mjs "$RUNNER_TEMP/code-consumer/"
          cd "$RUNNER_TEMP/code-consumer"
          CODE_PACKED_CONSUMER=1 \
            SPEC_ARCHITECTURE_SOURCE_DIR="$GITHUB_WORKSPACE/specification-source" \
            node --test source-reviewed-design-fabrication.test.mjs
          echo "Original packed Code recipient: HLD/LLD-derived runtime schemas installed and exercised; stale, unmodeled and cross-stage sources refused; source adoption, Proof, host installation and beneficiary effects remain open."

      - name: Independently pack, install and behavior-assay the exact JSNode producer from Code
        shell: bash
        run: |
          set -euo pipefail
          selected=f039a4fd4f3fc844fc7aa7455dd16f38ebf1cd77
          test "$(git ls-tree HEAD services/jsnode-package-services-section | awk '{print $3}')" = "$selected"
          test "$(git -C jsnode-package-source rev-parse HEAD)" = "$selected"
          test "$(node -p "require('./jsnode-package-source/package.json').version")" = "0.5.1-dev.5"
          mkdir -p "$RUNNER_TEMP/jsnode-receiving-archive" "$RUNNER_TEMP/jsnode-clean-consumer"
          (
            cd jsnode-package-source
            npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/jsnode-receiving-archive" >/dev/null
          )
          shopt -s nullglob
          archives=( "$RUNNER_TEMP"/jsnode-receiving-archive/*.tgz )
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          sha256sum "$archive"
          npm install --prefix "$RUNNER_TEMP/jsnode-clean-consumer" "$archive"             --ignore-scripts --no-audit --no-fund --no-package-lock             --registry=https://registry.561.group/
          cp test/jsnode-assay-packed-receiver.mjs "$RUNNER_TEMP/jsnode-clean-consumer/"
          (
            cd "$RUNNER_TEMP/jsnode-clean-consumer"
            node --check jsnode-assay-packed-receiver.mjs
            node --test --test-reporter=tap jsnode-assay-packed-receiver.mjs
          )
          echo "Exact gitlink producer received by a clean Code-owned consumer. Native module behavior assayed; operating host, Work, Stage Proof and independent buyer receiving remain unobserved."
